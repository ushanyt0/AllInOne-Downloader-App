name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - run: gradle assembleRelease
      - name: Sign APK
        run: |
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          keytool -genkeypair -keystore release.jks -storepass shancodex -keypass shancodex -alias shan -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Shan Codex"
          $ANDROID_HOME/build-tools/$BT/zipalign -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner sign --ks release.jks --ks-pass pass:shancodex --key-pass pass:shancodex --v1-signing-enabled true --v2-signing-enabled true --out AllInOneDownloader.apk aligned.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          prerelease: true
          files: AllInOneDownloader.apk
